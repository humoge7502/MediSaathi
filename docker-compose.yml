services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - MEDISAATHI_CORS=${MEDISAATHI_CORS:-http://localhost:3000}
      - MEDISAATHI_VISION_KEY=${MEDISAATHI_VISION_KEY:-}
      - MEDISAATHI_VISION_MODEL=${MEDISAATHI_VISION_MODEL:-gemini-2.0-flash}
      - MEDISAATHI_VISION_BASE_URL=${MEDISAATHI_VISION_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - MEDISAATHI_JUDGE_OPEN=${MEDISAATHI_JUDGE_OPEN:-1}
      - MEDISAATHI_DB_PATH=/data/medisaathi.db
    volumes:
      - medisaathi-data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    environment:
      # The web app is self-contained (route handlers + SQLite). The API
      # service above remains the deep-verification companion.
      - DATABASE_URL=file:/app/db/custom.db
    volumes:
      - medisaathi-web-db:/app/db
    ports:
      - "3000:3000"
    healthcheck:
      # bun is guaranteed present in the runner image; probes the deterministic
      # evidence route (no model dependency).
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/evidence').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  medisaathi-data:
  medisaathi-web-db: