services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      - MEDISAATHI_CORS=${MEDISAATHI_CORS:-http://localhost:3000}
      - MEDISAATHI_VISION_KEY=${MEDISAATHI_VISION_KEY:-}
      - MEDISAATHI_VISION_MODEL=${MEDISAATHI_VISION_MODEL:-gemini-2.0-flash}
      - MEDISAATHI_VISION_BASE_URL=${MEDISAATHI_VISION_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - MEDISAATHI_JUDGE_OPEN=${MEDISAATHI_JUDGE_OPEN:-1}
      - MEDISAATHI_DB_PATH=/data/medisaathi.db
    volumes:
      - medisaathi-data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  medisaathi-data:
