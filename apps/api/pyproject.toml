[project]
name = "medisaathi-api"
version = "0.1.0"
description = "MediSaathi verification-first prescription API (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "medisaathi-contracts",
]

[project.optional-dependencies]
# httpx2 is the TestClient transport Starlette 1.10 asks for; httpx stays for the
# direct ASGITransport use in tools/bench.py. See constraints.txt.
dev = ["pytest>=8", "httpx>=0.27", "httpx2>=2.0", "hypothesis>=6.100", "ruff>=0.6"]
prod = ["httpx>=0.27"]  # live-vision HTTP client; dev extra already includes tests

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
