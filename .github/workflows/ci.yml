name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege: jobs only ever need to read the code.
permissions:
  contents: read

# A new push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    name: api (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (pinned via constraints.txt, MS-11)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e packages/contracts
          pip install -c constraints.txt -e "apps/api[dev]"
      - name: Lint (ruff)
        run: |
          pip install "ruff>=0.6"
          ruff check apps/api packages/contracts eval tools
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable --progress-spinner off
      - name: Test (safety plane + golden paths + perception + red-team + parity)
        run: pytest apps/api -q
      - name: Eval regression gate (floors + committed baseline, ADR-0013)
        run: python eval/regression_gate.py
      - name: Eval (fixture benchmark, A4)
        run: python eval/eval.py
      - name: Ablation smoke (A1 counterfactual runs)
        run: python eval/eval.py --ablation A1 > /dev/null
      - name: Demo check (offline sealed cases, all six verdict kinds)
        run: make demo-check

  web:
    name: web (next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Prisma client
        working-directory: apps/web
        run: bunx prisma generate
      - name: Lint (eslint)
        working-directory: apps/web
        run: bun run lint
      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck
      - name: Deterministic selftest (engine 18-case suite + copilot gates)
        working-directory: apps/web
        run: bun run selftest
      - name: Cross-engine parity gate (ADR-0012, 25/25 required)
        working-directory: apps/web
        run: bun run parity
      - name: Integration tests (route handlers + middleware security over isolated SQLite)
        working-directory: apps/web
        run: bun run test
      - name: bun audit (JS-tier advisory gate, MS-11)
        working-directory: apps/web
        # High-and-above must be clean. The single dev-only advisory
        # (deepmerge-ts stack exhaustion via prisma's config loader, build-time
        # only) is an accepted, documented exception: no fix exists within
        # prisma's own range (GHSA-ggr8-5vv4-36mx). Re-visit on prisma bumps.
        run: bun audit --audit-level=high --ignore GHSA-ggr8-5vv4-36mx
      - name: Production build
        working-directory: apps/web
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  web-e2e:
    name: web e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Prisma client
        working-directory: apps/web
        run: bunx prisma generate
      - name: Install Playwright browsers
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      - name: E2E (browser journeys on the deterministic tier)
        working-directory: apps/web
        run: bun run e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Dependency review summarizes new vulnerable dependencies on PRs only.
  dependency-review:
    name: dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
