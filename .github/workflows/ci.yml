name: ci
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e packages/contracts
          pip install -e "apps/api[dev]"
      - name: Test (safety plane + API golden paths + perception)
        run: pytest apps/api -q
      - name: Eval (fixture benchmark, A4)
        run: python eval/eval.py
      - name: Ablation smoke (A1 counterfactual runs)
        run: python eval/eval.py --ablation A1 > /dev/null
      - name: Demo check (offline sealed cases, all six verdict kinds)
        run: make demo-check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/web
        run: npm run build
