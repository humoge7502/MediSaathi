name: ci
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e packages/contracts
          pip install -e "apps/api[dev]"
      - name: Test (safety plane + API golden paths + perception)
        run: pytest apps/api -q
      - name: Eval (fixture benchmark, A4)
        run: python eval/eval.py
      - name: Ablation smoke (A1 counterfactual runs)
        run: python eval/eval.py --ablation A1 > /dev/null
      - name: Demo check (offline sealed cases, all six verdict kinds)
        run: make demo-check

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        working-directory: apps/web
        run: bun install --frozen-lockfile
      - name: Prisma client
        working-directory: apps/web
        run: bunx prisma generate
      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck
      - name: Deterministic selftest (engine 18-case suite + copilot gates)
        working-directory: apps/web
        run: bun run selftest
      - name: Production build
        working-directory: apps/web
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"